[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-platform"
version = "0.1.0"
description = "Energy Intelligence Platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "tzdata>=2024.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# A deliberately modest rule set for an existing, working codebase: real
# bugs and dead code (F), import hygiene (I), and the handful of E/W style
# checks pyflakes doesn't already cover -- not a full style rewrite.
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]
