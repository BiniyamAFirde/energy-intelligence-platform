# Render Blueprint for the Energy Intelligence Platform.
#
# Three resources: a Docker-runtime FastAPI web service, a static-runtime
# React/Vite site, and a managed PostgreSQL database. See
# docs/deployment_render.md for the full, step-by-step deployment guide --
# this file alone does not fully automate deployment: a few values below
# are deliberately left as placeholders (marked PLACEHOLDER) or as
# `sync: false` (set manually in the Render Dashboard) because they either
# depend on URLs Render only assigns after the first deploy, or are
# genuinely secret/deployment-specific values this repository must not
# hardcode. Nothing here has been applied to a live Render account by an
# automated process -- creating the actual resources requires either the
# Render Dashboard's "New Blueprint" flow pointed at this repo, or the
# Render CLI, run by a human with Render account access.
#
# Region: Frankfurt for both the backend and the database (closest Render
# region to Italy, per the project owner's location), and for the static
# frontend site too, purely for regional consistency -- Render's static
# sites are served from its global CDN regardless of the configured
# region, so this choice has no latency effect for frontend visitors.

databases:
  - name: energy-platform-db
    databaseName: energy_platform
    user: energy_user
    region: frankfurt
    # PLACEHOLDER: verify this plan id in the Render Dashboard at
    # deploy time -- Render's Postgres plan ids/names are not something
    # this environment could verify live. The measured local database is
    # ~308MB (see docs/deployment_render.md Phase 5) with 1,052,400 energy
    # rows, so it fits well within Render's smallest paid Postgres tier by
    # size alone -- but the FREE Postgres tier is deliberately NOT used
    # here: Render's free Postgres instances expire and are deleted after
    # 30 days, which would silently destroy this demo's data. Pick
    # whichever paid, non-expiring plan the Dashboard currently offers as
    # its smallest tier (commonly labeled "Basic"/"Starter" at the time of
    # writing).
    plan: basic-256mb

services:
  # --- Backend: FastAPI, running the existing backend/Dockerfile unchanged
  # in structure (only PORT-handling and the pre-start model-fetch step
  # were added -- see backend/Dockerfile and backend/docker-entrypoint.sh).
  - type: web
    name: energy-platform-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: frankfurt
    # Required: >=2GB RAM. The model artifact alone is ~552MB in memory
    # once deserialized by joblib/scikit-learn (an in-memory
    # RandomForestRegressor's tree structures are larger than the
    # on-disk pickle size), plus the running Python/uvicorn process,
    # pandas, and request handling overhead. Do NOT use Render's free
    # (512MB) plan -- it will OOM. 1c-2g (1 vCPU / 2GB RAM) is the
    # smallest plan that comfortably fits; verify this exact plan id is
    # still current in the Render Dashboard/API before applying, since
    # Render's compute plan id list can change.
    plan: 1c-2g
    numInstances: 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: energy-platform-db
          property: connectionString
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # PLACEHOLDER: Render only assigns the frontend's URL once that
      # static site has been created/deployed. Set this to the real
      # frontend URL (https://<frontend-service>.onrender.com) after
      # Phase 4's frontend service exists -- see docs/deployment_render.md.
      # Comma-separated if you ever need more than one allowed origin.
      - key: CORS_ORIGINS
        value: https://energy-platform-frontend.onrender.com
      # Declared but not currently read by any auth code path (this
      # project has no authentication -- see README Limitations); still
      # required because Settings.jwt_secret_key has no default and the
      # app fails fast at import time otherwise. generateValue: true asks
      # Render to generate and store a random value itself -- never
      # written into this file.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # sync: false => set manually in the Render Dashboard, not stored in
      # this file or Git. Points at the GitHub Release asset created per
      # docs/deployment_render.md Phase 3 (e.g.
      # https://github.com/BiniyamAFirde/energy-intelligence-platform/releases/download/model-v1/random_forest_v1.joblib).
      # backend/docker_model_fetch.py downloads and SHA256-verifies it
      # before uvicorn starts; see that file and
      # backend/docker-entrypoint.sh.
      - key: MODEL_ARTIFACT_URL
        sync: false
      # The known-good SHA256 of models/random_forest_v1.joblib (also the
      # docker_model_fetch.py default, repeated here explicitly so the
      # expected value is visible in the Blueprint itself, not just in
      # code) -- a public checksum, not a secret.
      - key: MODEL_ARTIFACT_SHA256
        value: 2b859538307206b4516ff23c984878b1051a05cc910480ec9bdcd27ee83421a8

  # --- Frontend: React + TypeScript + Vite, built and served as a static
  # site (not the frontend/Dockerfile's dev server -- that image runs
  # `npm run dev` and is for local Docker Compose only).
  - type: web
    name: energy-platform-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # BrowserRouter (frontend/src/main.tsx) needs every path rewritten
      # to index.html so React Router -- not Render's static file server --
      # resolves client-side routes like /external-forecast on a hard
      # refresh or a shared deep link.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite bakes VITE_* variables in at BUILD time, not runtime -- this
      # must be set (Dashboard or here) BEFORE the build that should use
      # it. PLACEHOLDER: set to the real backend URL
      # (https://<backend-service>.onrender.com) once the backend service
      # above exists; see docs/deployment_render.md.
      - key: VITE_API_BASE_URL
        value: https://energy-platform-backend.onrender.com
